<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex" />
    <title>Image — Component Snippets</title>
    <!-- google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ライブラリ共通ヘッダー -->
    <header class="p-lib-header">
      <div class="p-lib-header__inner">
        <a href="index.html" class="p-lib-header__back">← 一覧</a>
        <span class="p-lib-header__brand">Component Snippets</span>
        <span class="p-lib-header__category">Image</span>
      </div>
    </header>

    <main>
      <div class="l-inner">
        <h1 class="p-lib-page-title">Image</h1>

        <!-- ぼかし画像 -->
        <section class="c-snippet" aria-labelledby="title-a-image">
          <div class="c-snippet__meta">
            <h2 class="c-snippet__title" id="title-a-image">ぼかし画像エフェクト</h2>
            <span class="c-snippet__scss">image.scss / .a__image</span>
            <button class="c-snippet__copy js-copy-btn" type="button" data-target="demo-a-image">HTMLをコピー</button>
          </div>
          <div class="c-snippet__demo" id="demo-a-image">
            <div class="a__image">
              <img
                src="img/img_insight-1.webp"
                alt="ベッドに座ってスマホを操作している女性の画像"
                width="300"
                height="200"
                loading="lazy"
                decoding="async"
              />
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="js/script.js" defer></script>
  </body>
</html>
