<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex" />
    <title>Flow — Component Snippets</title>
    <!-- google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ライブラリ共通ヘッダー -->
    <header class="p-lib-header">
      <div class="p-lib-header__inner">
        <a href="index.html" class="p-lib-header__back">← 一覧</a>
        <span class="p-lib-header__brand">Component Snippets</span>
        <span class="p-lib-header__category">Flow</span>
      </div>
    </header>

    <main>
      <div class="l-inner">
        <h1 class="p-lib-page-title">Flow</h1>

        <!-- 3つトライアングル図解 -->
        <section class="c-snippet" aria-labelledby="title-a-flow">
          <div class="c-snippet__meta">
            <h2 class="c-snippet__title" id="title-a-flow">3つトライアングル図解</h2>
            <span class="c-snippet__scss">flow.scss / .a-flow</span>
            <button class="c-snippet__copy js-copy-btn" type="button" data-target="demo-a-flow">HTMLをコピー</button>
          </div>
          <div class="c-snippet__demo" id="demo-a-flow">
            <ul class="a-flow">
              <li class="a-flow__item">
                <p class="a-flow__text">続けられない</p>
                <div class="a-flow__image">
                  <img
                    src="img/img_flow-1.webp"
                    alt="女性が悲しんでいるイラスト"
                    width="72"
                    height="72"
                    loading="lazy"
                    decoding="async"
                  />
                </div>
              </li>
              <li class="a-flow__item">
                <p class="a-flow__text">結局割引</p>
                <div class="a-flow__image">
                  <img
                    src="img/img_flow-2.webp"
                    alt="天秤にお金が乗っているイラスト"
                    width="58"
                    height="58"
                    loading="lazy"
                    decoding="async"
                  />
                </div>
              </li>
              <li class="a-flow__item">
                <p class="a-flow__text">集客できない</p>
                <div class="a-flow__image">
                  <img
                    src="img/img_flow-3.webp"
                    alt="お店に行列ができているイラスト"
                    width="72"
                    height="72"
                    loading="lazy"
                    decoding="async"
                  />
                </div>
              </li>
            </ul>
          </div>
        </section>
      </div>
    </main>

    <script src="js/script.js" defer></script>
  </body>
</html>
