<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex" />
    <title>Card — Component Snippets</title>
    <!-- google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ライブラリ共通ヘッダー -->
    <header class="p-lib-header">
      <div class="p-lib-header__inner">
        <a href="index.html" class="p-lib-header__back">← 一覧</a>
        <span class="p-lib-header__brand">Component Snippets</span>
        <span class="p-lib-header__category">Card</span>
      </div>
    </header>

    <main>
      <div class="l-inner">
        <h1 class="p-lib-page-title">Card</h1>

        <!-- 番号付きカード -->
        <section class="c-snippet" aria-labelledby="title-a-card">
          <div class="c-snippet__meta">
            <h2 class="c-snippet__title" id="title-a-card">番号付きベネフィットカード</h2>
            <span class="c-snippet__scss">card.scss / .a-card</span>
            <button class="c-snippet__copy js-copy-btn" type="button" data-target="demo-a-card">HTMLをコピー</button>
          </div>
          <div class="c-snippet__demo" id="demo-a-card">
            <div class="a-card">
              <div class="a-card__head">
                <div class="a-card__bg"></div>
                <span class="a-card__number">01</span>
                <h3 class="a-card__text">もう"文章に1時間"<br />悩まなくていい</h3>
              </div>
              <div class="a-card__body">
                <div class="a-card__description-wrap">
                  <p class="a-card__description">
                    今までは、投稿1つ考えるだけで1時間。「この表現でいいのかな？」「もっといい言い方があるのでは？」と手が止まっていたかもしれません。でもサロンチャームなら、型に沿ってスマホでポチポチするだけ。10分
                    ※ほどで"予約につながる文章"が完成します。余った時間は施術に集中することも、ゆっくりお茶を飲むことだってできます。
                  </p>
                  <span class="a-card__attention">
                    ※文章作成時間には個人差があります。<br />慣れによって所要時間が短縮されるケースもあります。
                  </span>
                </div>
                <figure class="a-card__image">
                  <img
                    src="img/img_benefit-1.webp"
                    loading="lazy"
                    decoding="async"
                    alt="12時を指し示そうな時計の画像"
                    width="361"
                    height="180"
                  />
                </figure>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="js/script.js" defer></script>
  </body>
</html>
